<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RNG</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Norican&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Blocker" onclick="proceed()"></div>
    <div class="Narrator" onclick="nextText()"><p id="NarratorText">testststst</p></div>
    <main>
        <div class="Streak">
            <p id="StreakNum">Streak: 000</p>
        </div>
        <div class="RNumber">
            <p id="TheNumber">000</p>
        </div>
        <div class="answers">
            <div class="anwser" id="Math" onclick="guess('Math')">
                <p>.Math</p>
            </div>
            <div class="anwser" id="Cursor" onclick="guess('Cursor')">
                <p>Cursor Pos</p>
            </div>
            <div class="anwser" id="Time" onclick="guess('Time')">
                <p>Time Based</p>
            </div>
            <div class="anwser" id="Prev" onclick="guess('Prev')">
                <p>Previous Based</p>
            </div>
        </div>
    </main>
<script src="script.js"></script>
</body>
</html>
